name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --package percent-grading -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: python benchmarks/generate.py --check
      - run: python benchmarks/adversarial/generate.py --check
      - run: cargo run --locked --example embed
      - run: cargo run --locked -- api examples/integration/compile.request.json
      - run: node --test sdk/javascript/test/client.test.mjs
      - run: node --test tests/review_ui.test.mjs
      - run: node --test sdk/javascript/test/http.integration.mjs
      - run: cargo run --locked -- compile policies/apple.aha --out local-runs/apple.lock.json
      - run: cargo run --locked -- demo local-runs/apple.lock.json examples/rust/apple-blue.fixture.json
      - run: cargo run --locked -- demo local-runs/apple.lock.json examples/rust/apple-disagreement.fixture.json
      - run: cargo run --locked -- select local-runs/apple.lock.json catalogs/apple.json --out local-runs/apple.research.json
      - run: cargo run --locked -- inspect-research local-runs/apple.lock.json local-runs/apple.research.json
      - run: cargo run --locked -- prompt local-runs/apple.lock.json examples/rust/apple-blue.txt --research local-runs/apple.research.json
      - run: cargo run --locked -- evidence-policy local-runs/apple.lock.json policies/apple-evidence.aha --out local-runs/apple.evidence-policy.json
      - run: cargo run --locked -- evidence-prepare local-runs/apple.lock.json local-runs/apple.evidence-policy.json examples/evidence/apple.dossier.json --out local-runs/apple.evidence-input.json
      - run: cargo run --locked -- evidence-import local-runs/apple.lock.json local-runs/apple.evidence-input.json examples/evidence/openai.review.json examples/evidence/claude.review.json --out local-runs/apple.evidence.json
      - run: cargo run --locked -- inspect-evidence local-runs/apple.lock.json local-runs/apple.evidence.json
      - run: cargo run --locked -- prompt local-runs/apple.lock.json examples/rust/apple-blue.txt --evidence local-runs/apple.evidence.json
      - run: cargo run --locked -- evidence-import local-runs/apple.lock.json local-runs/apple.evidence-input.json examples/evidence/openai.review.json examples/evidence/claude.disagreement.review.json --out local-runs/apple.disputed-evidence.json
      - run: cargo run --locked -- evidence-policy local-runs/apple.lock.json policies/apple-evidence-v2.aha --out local-runs/apple.evidence-policy-v2.json
      - run: cargo run --locked -- evidence-prepare local-runs/apple.lock.json local-runs/apple.evidence-policy-v2.json examples/evidence/apple-missing.dossier.json --out local-runs/apple.evidence-input-v2.json
      - run: cargo run --locked -- evidence-import local-runs/apple.lock.json local-runs/apple.evidence-input-v2.json examples/evidence/openai.missing.review.json examples/evidence/claude.missing.review.json --out local-runs/apple.evidence-v2.json
      - run: cargo run --locked -- evidence-compare local-runs/apple.lock.json local-runs/apple.evidence.json local-runs/apple.evidence-v2.json
      - run: cargo run --locked -- revise-evidence local-runs/apple.lock.json local-runs/apple.evidence.json local-runs/apple.evidence-v2.json examples/evidence/cohort.json --reason "Reassess every declared submission after evidence revision." --out local-runs/apple.reassessment.json
      - name: Public Crossref connectivity smoke check
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: cargo run --locked -- discover local-runs/apple.lock.json --query "surface reflectance color illumination" --rows 3 --timeout-seconds 20 --out local-runs/crossref-smoke.json
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m percent_grading aggregate examples/osmosis.case.json examples/osmosis.judgments.json
