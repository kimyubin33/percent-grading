[package]
name = "percent-grading"
version = "0.5.0"
edition = "2024"
description = "Evidence-based grading with a checked RelSpec contract and two constrained AI judges"
license = "MIT"
repository = "https://github.com/kimyubin33/percent-grading"

[dependencies]
aha = { path = "vendor/relspec" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
httpdate = { path = "vendor/httpdate" }

