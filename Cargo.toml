[package]
name = "percent-grading"
version = "0.3.0"
edition = "2024"
description = "Evidence-based grading with a checked RelSpec contract and two constrained AI judges"
license = "MIT"
repository = "https://github.com/kimyubin33/percent-grading"

[dependencies]
aha = { path = "vendor/relspec" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ring = "0.17.14"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }

[lints.rust]
unsafe_code = "forbid"

